<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Nihongo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f7f9f8;
  --grid: #d6e2e6;
  --ink: #1b2a5a;
  --line: #9aa7c2;
  --mute: #5c6a7a;
  --hl: #ffe66d;
  --on-hl: #1b1b1b;
  --ok: #1f7a4d;
  --bad: #b3261e;
  --hand: "Zen Kurenaido", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1f2a26; --grid: #2b3b34; --ink: #eef2ee; --line: #6c7f76;
    --mute: #a9b8b0; --hl: #e8d44d; --ok: #7bd9a6; --bad: #ff8f86;
  }
}
:root[data-theme="dark"] {
  --paper: #1f2a26; --grid: #2b3b34; --ink: #eef2ee; --line: #6c7f76;
  --mute: #a9b8b0; --hl: #e8d44d; --ok: #7bd9a6; --bad: #ff8f86;
}

/* ---------- dasar ---------- */
html, body {
  margin: 0;
  color: var(--ink);
  font-family: var(--body);
  line-height: 1.6;
}
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  background-attachment: fixed;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 18px 56px;
}
h1 {
  display: inline-block;
  position: relative;
  isolation: isolate;
  margin: 0;
  font: 400 36px/1.2 var(--hand);
}
h1::after {            /* coretan stabilo, satu kali saat halaman dibuka */
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -3px;
  height: 7px;
  background: var(--hl);
  transform-origin: left;
  animation: swipe .7s .15s ease-out both;
}
header p { margin: 4px 0 0; }
.credit { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; margin: 20px 0; }
.credit figure { margin: 0; width: 130px; text-align: center; }
.credit img, .credit .ph { display: block; width: 88px; height: 88px; margin: 0 auto 8px; }
.credit img { object-fit: contain; }
.credit .ph {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px dashed var(--line);
  color: var(--mute);
  font-size: 12px;
}
.credit figcaption { color: var(--mute); font-size: 13px; line-height: 1.3; }
.mu { color: var(--mute); font-size: 14px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- kontrol ---------- */
button, select {
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  padding: 9px 14px;
  cursor: pointer;
  transition: background .15s, transform .1s;
}
button:hover, select:hover { background: var(--hl); color: var(--on-hl); }
button:active { transform: translate(1px, 1px); }
select { width: 100%; margin: 16px 0 0; }
.pri, .pri:hover { background: var(--ink); color: var(--paper); }
.pri:hover { opacity: .88; }
[hidden] { display: none !important; }
#bar {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 20px;
}
#bar b { font: 400 22px var(--hand); }

/* ---------- menu ---------- */
.sheet, .box {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  border-radius: 4px;
}
.menu { margin-top: 22px; }
.item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 18px 20px;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.item + .item { border-top: 1.5px dashed var(--line); }
.item:hover { background: transparent; color: var(--ink); }
.item b {
  font: 400 24px var(--hand);
  padding: 0 4px;
  margin-left: -4px;
  background: linear-gradient(var(--hl), var(--hl)) no-repeat left center / 0% 100%;
  transition: background-size .25s, color .25s;
}
.item:hover b,
.item:focus-visible b {
  background-size: 100% 100%;
  color: var(--on-hl);
}
.menu.dense .item { padding: 12px 20px; }
.item small { display: block; margin-top: 2px; color: var(--mute); font-size: 14px; }

/* ---------- konten ---------- */
.box { padding: 22px; margin-top: 16px; }
.jp { font-size: 28px; line-height: 1.5; }
.ro { color: var(--mute); margin-top: 6px; }
.meaning { font-size: 19px; }
.row {
  display: flex;
  gap: 8px;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}

/* flashcard: tiap huruf di kotak seperti kertas genko-yoshi */
.fc {
  min-height: 210px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
  text-align: center;
  cursor: pointer;
}
.gy { display: flex; flex-wrap: wrap; justify-content: center; padding: 1px 0 0 1px; }
.cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35em; height: 1.35em;
  margin: -1px 0 0 -1px;
  border: 1px solid var(--line);
  font-size: 26px;
}
.words { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
.w {
  display: flex;
  flex-direction: column;
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 3px;
}
.w b { font-size: 17px; font-weight: 500; }
.w small { color: var(--mute); font-size: 12px; }

/* kuis */
.bar { height: 6px; background: var(--grid); margin: 6px 0 14px; }
.bar i { display: block; height: 100%; background: var(--ink); transition: width .4s; }
.opt { display: block; width: 100%; text-align: left; margin-top: 8px; }
.opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--paper)); color: var(--ink); }
.opt.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--paper)); color: var(--ink); }
.ex {
  margin-top: 14px;
  padding: 12px 14px;
  border-left: 4px solid var(--hl);
  background: color-mix(in srgb, var(--hl) 20%, var(--paper));
  font-size: 14px;
}
.yes { color: var(--ok); }
.nope { color: var(--bad); }

/* susun kata */
.ans { min-height: 58px; margin: 14px 0; padding-bottom: 6px; border-bottom: 1.5px solid var(--ink); }
.chip { margin: 4px; padding: 8px 12px; font-size: 20px; }

/* about */
.about h2 { margin: 0 0 8px; font: 400 26px var(--hand); }
.about dt { margin-top: 10px; font-weight: 700; }
.about dd { margin: 2px 0 0; color: var(--mute); font-size: 14px; }
.about ol { padding-left: 20px; font-size: 14px; line-height: 1.8; }

/* hiragana dan katakana */
button.on, button.on:hover { background: var(--ink); color: var(--paper); }
.kgroup { margin-top: 20px; }
.kgroup h3 { margin: 0 0 8px; font: 400 20px var(--hand); }
.kgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); max-width: 420px; padding: 1px 0 0 1px; }
.kc {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
  margin: -1px 0 0 -1px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--paper);
}
.kc b { font-size: 26px; font-weight: 500; line-height: 1.1; }
.kc small { font-size: 12px; color: var(--mute); transition: opacity .2s; }
.kc:hover small { color: var(--on-hl); }
.kc.empty { border-color: transparent; background: transparent; pointer-events: none; }
.hide .kc:not(.shown) small { opacity: 0; }

/* ---------- gerak ---------- */
@keyframes swipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
/* animasi: hanya yang menanggapi aksi, ditambah satu momen saat daftar dibuka */
@keyframes inkin  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
@keyframes sweep  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes shake  { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes slide-l { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: none; } }
@keyframes slide-r { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: none; } }
@keyframes flip-out { to { transform: perspective(700px) rotateY(90deg); opacity: .4; } }
@keyframes flip-in  { from { transform: perspective(700px) rotateY(-90deg); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes hop  { 40% { transform: translateY(-10px); } }
@keyframes grow { from { width: var(--from, 0%); } }

#v.enter { animation: fade .25s ease-out; }
.item { animation: inkin .35s both; animation-delay: min(calc(var(--n, 0) * 40ms), 500ms); }
.opt { position: relative; animation: inkin .3s both; animation-delay: calc(var(--n, 0) * 50ms); }
.opt.ok { animation: none; }
.opt.no { animation: shake .4s; }
.fc.slide-l { animation: slide-l .25s ease-out; }
.fc.slide-r { animation: slide-r .25s ease-out; }
.fc.flip-out { animation: flip-out .14s ease-in forwards; }
.fc.flip-in { animation: flip-in .2s ease-out; }
.bar i { animation: grow .5s ease-out; }
.item.all { border-top: 1.5px solid var(--ink); }
.chip { position: relative; }
.ans.shake { animation: shake .4s; }
.ans.wave .chip { animation: hop .4s ease-out; animation-delay: calc(var(--i, 0) * 60ms); }
.fx .kc:not(.empty) { animation: inkin .3s both; animation-delay: min(calc(var(--n, 0) * 12ms), 600ms); }

/* tanda maru (lingkaran) seperti koreksi guru, tergambar dari kiri ke kanan */
.maru {
  position: absolute;
  top: -1.5px; left: -1.5px; right: -1.5px; bottom: -1.5px;   /* menimpa garis tepi tombol */
  border: 1.5px solid var(--ok);
  border-radius: 4px;                                          /* sama dengan bentuk tombol */
  pointer-events: none;
  animation: sweep .45s ease-out both;
}
.score { position: relative; display: inline-block; padding: 10px 36px; margin: 4px 0 14px; text-align: center; }
.score span { display: block; font-size: 13px; color: var(--mute); }
.score b { font: 400 44px/1.1 var(--hand); }
.score .maru { top: 0; left: 0; right: 0; bottom: 0; border-width: 2.5px; border-radius: 50%; animation-duration: .7s; animation-delay: .15s; }

/* "Kurangi gerakan" di perangkat: gerak besar diganti efek memudar.
   Pengguna bisa memilih animasi penuh lewat halaman About. */
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="full"]) .fc.slide-l,
  :root:not([data-motion="full"]) .fc.slide-r,
  :root:not([data-motion="full"]) .fc.flip-in,
  :root:not([data-motion="full"]) .item,
  :root:not([data-motion="full"]) .opt,
  :root:not([data-motion="full"]) .fx .kc:not(.empty) { animation-name: fade; }
  :root:not([data-motion="full"]) .fc.flip-out,
  :root:not([data-motion="full"]) .opt.no,
  :root:not([data-motion="full"]) .ans.shake,
  :root:not([data-motion="full"]) .ans.wave .chip { animation: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Belajar Nihongo</h1>
    <p class="mu">Materi buku pelajaran Bab 1 sampai 24</p>
  </header>
  <div id="bar" hidden>
    <button id="back" onclick="goBack()">Kembali ke menu</button>
    <b id="title"></b>
  </div>
  <div id="v"></div>
</main>
<script>
/* =========================================================
   0. KREDIT LOGO  <-- ISI LOGO DI SINI
   Tampil di halaman About. Isi "src" dan "name" untuk tiap logo:
   - src: data URI gambar, contoh "data:image/png;base64,iVBORw0KGgo..."
          (dipakai jika halaman dipublikasikan sebagai link), atau
          nama file di folder yang sama, contoh "logo-universitas.png"
          (dipakai jika file HTML dibuka langsung dari komputer).
   - name: tulisan di bawah logo (kosongkan "" untuk menyembunyikan).
   Selama "src" kosong, yang tampil hanya kotak putus-putus.
   ========================================================= */
const CREDIT_LOGOS = [
  { src: "", alt: "Logo universitas", name: "Nama universitas" },
  { src: "", alt: "Logo sekolah",     name: "Nama sekolah" },
];

/* =========================================================
   1. DATA MATERI
   Format kalimat: "kata kata kata~romaji~arti"
   Spasi memisahkan kata (dipakai game Susun Kata & flashcard).
   ========================================================= */
const CHAPTERS_RAW = [
[1,"はじめまして","Pola 「N です」 = 'adalah N'. Dipakai untuk memperkenalkan diri. Nama asing ditulis dengan katakana.",["おはよう ございます~Ohayou gozaimasu~Selamat pagi (sopan)","こんにちは~Konnichiwa~Selamat siang","こんばんは~Konbanwa~Selamat malam","はじめまして~Hajimemashite~Salam kenal","アユ です~Ayu desu~Saya Ayu","どうぞ よろしく おねがいします~Douzo yoroshiku onegaishimasu~Mohon bantuannya"]],
[2,"ありがとう","「〜ください」 = tolong lakukan; 「〜ですか」 = kalimat tanya; 「いいですか」 = bolehkah?",["ありがとう ございます~Arigatou gozaimasu~Terima kasih (sopan)","さようなら~Sayounara~Selamat tinggal","じゃ また~Ja, mata~Sampai jumpa lagi","みて ください~Mite kudasai~Tolong lihat","もう いちど おねがいします~Mou ichido onegaishimasu~Tolong sekali lagi","すみません トイレ いいですか~Sumimasen, toire ii desu ka~Permisi, bolehkah (ke) toilet?","いいですよ どうぞ~Ii desu yo. Douzo~Boleh, silakan"]],
[3,"わたしの ゆめは かしゅです","Tanggal: 〜がつ (bulan) + 〜にち (hari); tanggal 1–10 punya bacaan khusus (3 = mikka). 「A は B です」; 「の」 menyatakan kepemilikan.",["1がつ23にち~Ichi-gatsu ni-juu-san-nichi~23 Januari","たんじょうび は 5がつ 3っか です~Tanjoubi wa go-gatsu mikka desu~Ulang tahunku 3 Mei","ゆめ は いしゃ です~Yume wa isha desu~Cita-citaku dokter","わたし の たんじょうび は 4がつ 30にち です~Watashi no tanjoubi wa shi-gatsu san-juu-nichi desu~Ulang tahunku 30 April"]],
[4,"ちちは スポーツが すきです","「N が すき です」 = suka N. Partikel 「ね」 meminta persetujuan. Adjektiva-i/na + です untuk menyatakan ciri.",["これ は はは です~Kore wa haha desu~Ini ibu saya","ともだち は かわいい です~Tomodachi wa kawaii desu~Temanku imut","かっこいい です ね~Kakkoii desu ne~Keren ya","いもうと は アニメ が すき です~Imouto wa anime ga suki desu~Adikku suka anime"]],
[5,"りょうりが できます","「N が できます」 = bisa N. 「〜ましょう」 = ajakan 'mari'. 「〜て ください」 = permintaan.",["わたし は シラット が できます~Watashi wa silat ga dekimasu~Saya bisa silat","いいですね~Ii desu ne~Bagus ya","すごい です ね~Sugoi desu ne~Hebat ya","こんど おしえて ください~Kondo oshiete kudasai~Lain kali tolong ajari","こんど いっしょ に しましょう~Kondo issho ni shimashou~Lain kali mari lakukan bersama"]],
[6,"ここは としょしつです","Kata tempat: ここ (sini), そこ, あそこ. Pola 「N は ここ です」. 「きれい」 adalah adjektiva-na.",["ここ は こうちょうしつ です~Koko wa kouchoushitsu desu~Ini ruang kepala sekolah","カンティン は ここ です~Kantin wa koko desu~Kantin di sini","ろうか は きれい です~Rouka wa kirei desu~Koridornya bersih"]],
[7,"にほんごは かようびです","「hari + に」 = pada hari itu. 「と」 = dan (antar nomina). 「を」 = penanda objek.",["たいいく は すいようび です~Taiiku wa sui-youbi desu~Olahraga hari Rabu","きんようび に げいじゅつ を べんきょうします~Kin-youbi ni geijutsu o benkyou-shimasu~Hari Jumat belajar seni","にほんご は すいようび と きんようび です~Nihongo wa sui-youbi to kin-youbi desu~Bahasa Jepang hari Rabu dan Jumat"]],
[8,"いっしょに たべませんか","「で」 = tempat kegiatan, 「と」 = bersama siapa. 「〜ませんか」 = mengajak, 「〜ましょう」 = menerima ajakan.",["ナシ・ゴレン を たべます~Nasi goreng o tabemasu~Makan nasi goreng","きょうしつ で たべます~Kyoushitsu de tabemasu~Makan di kelas","ともだち と たべます~Tomodachi to tabemasu~Makan bersama teman","ひとり で たべます~Hitori de tabemasu~Makan sendiri","いっしょ に たべませんか~Issho ni tabemasen ka~Maukah makan bersama?","たべましょう~Tabemashou~Mari makan"]],
[9,"せんせいは やさしいです","「います」 untuk keberadaan makhluk hidup. 「N の となり」 = di sebelah N. 「きびしい」 adjektiva-i.",["アイせんせい は えいご の せんせい です~Ai-sensei wa eigo no sensei desu~Bu Ai guru bahasa Inggris","トトせんせい は きびしい です~Toto-sensei wa kibishii desu~Pak Toto tegas","リドせんせい は ラフミせんせい の となり に います~Rido-sensei wa Rahmi-sensei no tonari ni imasu~Pak Rido di sebelah Bu Rahmi"]],
[10,"ほうきは たなの よこです","「あります」 untuk benda mati; negatif 「ありません」. Posisi: うえ (atas), よこ (samping), となり.",["きょうしつ に ごみばこ と ほうき が あります~Kyoushitsu ni gomibako to houki ga arimasu~Di kelas ada tempat sampah dan sapu","プロジェクター は つくえ の うえ です~Purojekutaa wa tsukue no ue desu~Proyektor di atas meja","すみません ありません~Sumimasen, arimasen~Maaf, tidak ada"]],
[11,"すいようびに バティックを きます","「きます」 = memakai pakaian. Warna: しろ (putih), あか, あお. Hari + に = pada hari.",["きんようび に プラムカ の せいふく を きます~Kin-youbi ni pramuka no seifuku o kimasu~Hari Jumat memakai seragam pramuka","ベトナム の せいふく は しろ です~Betonamu no seifuku wa shiro desu~Seragam Vietnam putih"]],
[12,"ぶんかさいは 1がつ11にちでした","Lampau nomina: 「でした」; lampau verba: 「〜ました」. 「から〜まで」 = dari…sampai…. 「N の とき」 = ketika N.",["ぶんかさい は 1がつ 9にち でした~Bunkasai wa ichi-gatsu kokonoka deshita~Festival budaya tanggal 9 Januari","キャンプ は 10がつ 10にち から 11にち まで でした~Kyanpu wa juu-gatsu tooka kara juu-ichi-nichi made deshita~Kemah 10–11 Oktober","ぶんかさい の とき おんがく を ききました~Bunkasai no toki, ongaku o kikimashita~Saat festival, mendengarkan musik"]],
[13,"パダンに すんでいます","「に すんでいます」 = tinggal di. 「あります/います」 menyatakan lokasi.",["ジャカルタ に すんでいます~Jakarta ni sunde imasu~Tinggal di Jakarta","パダン は にしスマトラ に あります~Padan wa nishi-Sumatera ni arimasu~Padang ada di Sumatera Barat","ジョグジャカルタ は グドゥ が おいしい です~Jogjakarta wa gudeg ga oishii desu~Gudeg Jogja enak"]],
[14,"よく そうじを します","Kekerapan: よく (sering). 「が」 pada subjek menandai pelaku pekerjaan.",["わたし は よく りょうり を します~Watashi wa yoku ryouri o shimasu~Saya sering memasak","ちち が そうじ を します~Chichi ga souji o shimasu~Ayah yang membersihkan","アイロン を かけます~Airon o kakemasu~Menyetrika"]],

/* =========================================================
   2. PENGOLAHAN DATA
   ========================================================= */
const CHAPTERS = CHAPTERS_RAW.map(([no, title, grammar, lines]) => ({
  no, title, grammar,
  sentences: lines.map(line => {
    const [jp, romaji, meaning] = line.split("~");
    const tokens = jp.split(" ");
    return {
      tokens,
      jp: tokens.join(""),
      romaji,
      meaning,
      words: tokens.map(t => [t, GLOSSARY[t] || "—"]),
    };
  }),
}));

/* =========================================================
   3. STATE & HELPER
   ========================================================= */
const $ = id => document.getElementById(id);
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
/* Tiap huruf dibungkus kotak (gaya kertas genko-yoshi) */
/* Mulai ulang animasi masuk pada area isi (dipanggil saat layar berganti) */
function enter() {
  const v = $("v");
  v.classList.remove("enter");
  void v.offsetWidth;
  v.classList.add("enter");
}
/* Tanda maru untuk jawaban benar & skor */
const MARU = '<i class="maru"></i>';
const scoreBlock = (s, n) => `<div class="score"><span>Skor</span><b>${s}/${n}</b>${MARU}</div>`;
const cells = text => [...text].map(c => `<span class="cell">${c}</span>`).join("");

const state = {
  tab: -1,
  stage: "home",         // home | pick | content
  chapter: -1,          // -1 = semua bab
  deck: [], cardIndex: 0, flipped: false,
  quiz: { items: [], index: 0, score: 0, answered: false },
  order: null,
  kana: { script: "hira", mode: "chart", hide: false, drill: null },
};

/* Ambil kalimat sesuai bab terpilih (disertai info bab-nya) */
function getSentences() {
  const list = state.chapter < 0 ? CHAPTERS : [CHAPTERS[state.chapter]];
  return list.flatMap(c => c.sentences.map(s => ({ ...s, chapter: c })));
}

/* =========================================================
   3b. SIMPAN POSISI (agar refresh tidak mengulang dari awal)
   Disimpan di localStorage; semua akses dibungkus try/catch.
   ========================================================= */
const STORE_KEY = "nihongo-state-v2";

function saveState() {
  try {
    const o = state.order;
    localStorage.setItem(STORE_KEY, JSON.stringify({
      tab: state.tab, stage: state.stage, chapter: state.chapter,
      deck: state.deck.map(s => s.jp), cardIndex: state.cardIndex, flipped: state.flipped,
      quiz: state.quiz,
      kana: state.kana,
      order: o && { jp: o.sentence.jp, picked: o.picked.map(x => x.i), bank: o.bank.map(x => x.i) },
    }));
  } catch (e) { /* penyimpanan tidak tersedia: abaikan */ }
}

/* Kembalikan posisi terakhir. Mengembalikan true jika berhasil. */
function restoreState() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (!d || d.stage === "home" || !(d.tab >= 0 && d.tab < SECTIONS.length)) return false;
    if (!(d.chapter >= -1 && d.chapter < CHAPTERS.length)) return false;

    if (d.stage === "pick") { showChapterPicker(d.tab); return true; }

    state.chapter = d.chapter;
    const list = getSentences();

    if (d.tab === 0) {
      const byJp = new Map(list.map(s => [s.jp, s]));
      const deck = (d.deck || []).map(j => byJp.get(j)).filter(Boolean);
      if (deck.length) {
        state.deck = deck;
        state.cardIndex = Math.min(d.cardIndex || 0, deck.length - 1);
        state.flipped = !!d.flipped;
      } else resetDeck();
    }
    if (d.kana) state.kana = { ...state.kana, ...d.kana };
    if (d.tab === 2 && d.quiz && d.quiz.items && d.quiz.items.length) state.quiz = d.quiz;
    if (d.tab === 3 && d.order) {
      const s = list.find(x => x.jp === d.order.jp);
      if (s) {
        const bank = d.order.bank.map(i => ({ t: s.tokens[i], i }));
        state.order = { sentence: s, bank, picked: d.order.picked.map(i => bank.find(x => x.i === i)).filter(Boolean) };
      }
    }
    showContent(d.tab);
    return true;
  } catch (e) { return false; }
}

/* =========================================================
   4. NAVIGASI
   ========================================================= */
const SECTIONS = [
  { title: "Flashcard",  desc: "Hafalkan kalimat beserta arti tiap kata", render: renderFlashcard },
  { title: "Bunpou",     desc: "Penjelasan tata bahasa tiap bab",         render: renderGrammar },
  { title: "Kuis",       desc: "20 soal dengan penjelasan jawaban",       render: renderQuiz },
  { title: "Susun Kata", desc: "Game menyusun kalimat dengan benar",      render: renderOrderGame },
  { title: "Hiragana dan Katakana", desc: "Tabel huruf dan latihan membaca", render: renderKana, noChapter: true },
  { title: "About",      desc: "Isi website dan cara belajar", render: renderAbout, noChapter: true },
];

/* Pilihan "animasi penuh" (menimpa pengaturan kurangi gerakan perangkat) */
const MOTION_KEY = "nihongo-motion";

function applyMotion() {
  try { document.documentElement.dataset.motion = localStorage.getItem(MOTION_KEY) || ""; } catch (e) {}
}

function toggleMotion() {
  try {
    if (localStorage.getItem(MOTION_KEY) === "full") localStorage.removeItem(MOTION_KEY);
    else localStorage.setItem(MOTION_KEY, "full");
  } catch (e) {}
  applyMotion();
  renderAbout();
}

function initUI() {
  applyMotion();
  if (!restoreState()) showHome();
}

/* Halaman menu utama */
function showHome() {
  enter();
  state.tab = -1;
  state.stage = "home";
  $("bar").hidden = true;

  $("v").innerHTML = `
    <div class="menu sheet">
      ${SECTIONS.map((s, i) => `
        <button class="item" style="--n:${i}" onclick="openSection(${i})">
          <b>${s.title}</b>
          <small>${s.desc}</small>
        </button>`).join("")}
    </div>`;
  saveState();
}

/* Buka salah satu bagian dari menu: pilih bab dulu (kecuali About) */
function openSection(i) {
  if (SECTIONS[i].noChapter) startSection(i);
  else showChapterPicker(i);
}

/* Layar pilih bab */
function showChapterPicker(i) {
  enter();
  state.tab = i;
  state.stage = "pick";
  setBar("Kembali ke menu", `${SECTIONS[i].title}: pilih bab`);

  $("v").innerHTML = `
    <div class="menu dense sheet">
      ${CHAPTERS.map((c, k) => `
        <button class="item" style="--n:${k}" onclick="startSection(${i}, ${k})">
          <b>Bab ${c.no}</b>
          <small>${c.title}</small>
        </button>`).join("")}
      <button class="item all" style="--n:${CHAPTERS.length}" onclick="startSection(${i}, -1)">
        <b>Semua bab</b>
        <small>Gabungan Bab ${CHAPTERS[0].no} sampai Bab ${CHAPTERS[CHAPTERS.length - 1].no}</small>
      </button>
    </div>`;
  window.scrollTo({ top: 0 });
  saveState();
}

/* Mulai bagian terpilih dengan bab yang dipilih (selalu dari awal) */
function startSection(i, chapter = -1) {
  state.chapter = chapter;
  if (i === 0) resetDeck();
  if (i === 2) state.quiz.items = [];
  if (i === 3) state.order = null;
  if (i === 4) { state.kana.mode = "chart"; state.kana.drill = null; state.kana.fx = true; }
  showContent(i);
}

/* Tampilkan isi bagian (tanpa mengatur ulang state) */
function showContent(i) {
  enter();
  state.tab = i;
  state.stage = "content";

  const s = SECTIONS[i];
  if (s.noChapter) {
    setBar("Kembali ke menu", s.title);
  } else {
    const label = state.chapter < 0 ? "Semua bab" : `Bab ${CHAPTERS[state.chapter].no}`;
    setBar("Ganti bab", `${s.title}: ${label}`);
  }
  s.render();
  window.scrollTo({ top: 0 });
  saveState();
}

function goBack() {
  if (state.stage === "content" && !SECTIONS[state.tab].noChapter) showChapterPicker(state.tab);
  else showHome();
}

function setBar(backText, title) {
  $("bar").hidden = false;
  $("back").textContent = backText;
  $("title").textContent = title;
}

/* =========================================================
   5. FLASHCARD
   ========================================================= */
function resetDeck() {
  state.deck = getSentences();
  state.cardIndex = 0;
  state.flipped = false;
}

function moveCard(step) {
  const n = state.deck.length;
  state.cardIndex = (state.cardIndex + step + n) % n;
  state.flipped = false;
  state.cardAnim = step > 0 ? "slide-l" : "slide-r";
  renderFlashcard();
}

/* Kartu berputar setengah putaran, isinya berganti, lalu putar balik */
function flipCard() {
  if (state.flipping) return;
  const el = document.querySelector(".fc");
  if (!el) return;
  state.flipping = true;
  el.classList.add("flip-out");
  setTimeout(() => {
    state.flipping = false;
    state.flipped = !state.flipped;
    state.cardAnim = "flip-in";
    renderFlashcard();
  }, 140);
}

function shuffleDeck() {
  state.deck = shuffle(state.deck);
  state.cardIndex = 0;
  state.flipped = false;
  renderFlashcard();
}

function renderFlashcard() {
  const s = state.deck[state.cardIndex];
  const anim = state.cardAnim || "";
  state.cardAnim = "";
  const front = `
    <div class="gy">${cells(s.jp)}</div>
    <div class="mu">ketuk untuk membalik</div>`;
  const back = `
    <div class="meaning">${s.meaning}</div>
    <div class="ro">${s.romaji}</div>
    <div class="words">
      ${s.words.map(([t, m]) => `<span class="w"><b>${t}</b><small>${m}</small></span>`).join("")}
    </div>`;

  $("v").innerHTML = `
    <div class="box fc ${anim}" onclick="flipCard()">${state.flipped ? back : front}</div>
    <div class="row">
      <button onclick="moveCard(-1)">Sebelumnya</button>
      <span class="mu">${state.cardIndex + 1}/${state.deck.length}</span>
      <button onclick="moveCard(1)">Berikutnya</button>
    </div>
    <div class="row"><button onclick="shuffleDeck()">Acak urutan</button></div>`;
  saveState();
}

/* =========================================================
   6. BUNPOU
   ========================================================= */
function renderGrammar() {
  const list = state.chapter < 0 ? CHAPTERS : [CHAPTERS[state.chapter]];
  $("v").innerHTML = list.map(c => `
    <div class="box" style="margin-bottom:12px">
      <b>Bab ${c.no}: ${c.title}</b>

      ${c.sentences.map(s => `
        <p><span class="jp" style="font-size:20px">${s.jp}</span><br>
        <span class="ro">${s.romaji}</span><br>${s.meaning}</p>`).join("")}
    </div>`).join("");
}

/* =========================================================
   7. KUIS
   ========================================================= */
const QUIZ_SIZE = 20;   // jumlah soal per sesi

/* Ambil n nilai unik (selain jawaban); nilai "preferred" diutamakan */
function pickDistractors(preferred, fallback, answer, n = 3) {
  const seen = new Set([answer]);
  const out = [];
  for (const v of [...shuffle(preferred), ...shuffle(fallback)]) {
    if (!seen.has(v)) { seen.add(v); out.push(v); }
    if (out.length === n) break;
  }
  return out;
}

/* Kumpulkan semua kandidat soal, dikelompokkan per jenis */
function collectQuestions() {
  const scope = getSentences();
  const allSentences = CHAPTERS.flatMap(c => c.sentences);
  const allTokens = Object.keys(GLOSSARY);
  const scopeTokens = [...new Set(scope.flatMap(s => s.tokens))].filter(t => GLOSSARY[t]);
  const groups = { jp2id: [], id2jp: [], ro2id: [], jp2ro: [], blank: [], word2id: [], id2word: [] };

  const sentenceInfo = s =>
    `${s.jp} (${s.romaji}) berarti "${s.meaning}".<br><i>Bunpou:</i> ${s.chapter.grammar}`;
  const add = (type, question, answer, preferred, fallback, explanation) =>
    groups[type].push({
      question, answer, explanation,
      options: shuffle([answer, ...pickDistractors(preferred, fallback, answer)]),
    });

  const meanings = scope.map(s => s.meaning), allMeanings = allSentences.map(s => s.meaning);
  const jps = scope.map(s => s.jp),           allJps = allSentences.map(s => s.jp);
  const ros = scope.map(s => s.romaji),       allRos = allSentences.map(s => s.romaji);

  scope.forEach(s => {
    const info = sentenceInfo(s);
    add("jp2id", `Apa arti dari 「${s.jp}」?`, s.meaning, meanings, allMeanings, `Jawaban benar: <b>${s.meaning}</b>. ${info}`);
    add("id2jp", `Manakah bahasa Jepang dari: "${s.meaning}"?`, s.jp, jps, allJps, `Jawaban benar: <b>${s.jp}</b>. ${info}`);
    add("ro2id", `Apa arti dari kalimat berromaji: "${s.romaji}"?`, s.meaning, meanings, allMeanings, `Jawaban benar: <b>${s.meaning}</b>. ${info}`);
    add("jp2ro", `Bagaimana cara membaca 「${s.jp}」?`, s.romaji, ros, allRos, `Jawaban benar: <b>${s.romaji}</b>. ${info}`);

    /* soal melengkapi kalimat: satu kata dikosongkan */
    if (s.tokens.length >= 2) {
      s.tokens.forEach((t, k) => {
        if (!GLOSSARY[t]) return;
        const blanked = s.tokens.map((x, i) => (i === k ? "＿＿＿" : x)).join("");
        add("blank", `Lengkapi kalimat: 「${blanked}」<br><span class="mu">Artinya: "${s.meaning}"</span>`, t,
          scopeTokens, allTokens,
          `Jawaban benar: <b>${t}</b> (${GLOSSARY[t]}).<br>Kalimat lengkap: ${sentenceInfo(s)}`);
      });
    }
  });

  /* soal arti kata */
  scopeTokens.forEach(t => {
    const example = scope.find(s => s.tokens.includes(t));
    const info = `<br>Contoh: ${example.jp} (${example.romaji}) = "${example.meaning}".<br><i>Bunpou:</i> ${example.chapter.grammar}`;
    add("word2id", `Apa arti kata 「${t}」?`, GLOSSARY[t],
      scopeTokens.map(x => GLOSSARY[x]), allTokens.map(x => GLOSSARY[x]),
      `Jawaban benar: <b>${GLOSSARY[t]}</b>. 「${t}」 berarti "${GLOSSARY[t]}".${info}`);
    add("id2word", `Kata Jepang manakah yang berarti "${GLOSSARY[t]}"?`, t, scopeTokens, allTokens,
      `Jawaban benar: <b>${t}</b>. 「${t}」 berarti "${GLOSSARY[t]}".${info}`);
  });

  return groups;
}

/* Pilih soal bergantian antar jenis agar variatif */
function buildQuiz() {
  const groups = Object.values(collectQuestions()).map(shuffle);
  const items = [], seen = new Set();
  let progress = true;
  while (items.length < QUIZ_SIZE && progress) {
    progress = false;
    for (const g of groups) {
      while (g.length) {
        const q = g.pop();
        if (seen.has(q.question)) continue;
        seen.add(q.question); items.push(q); progress = true;
        break;
      }
      if (items.length >= QUIZ_SIZE) break;
    }
  }
  state.quiz = { items: shuffle(items), index: 0, score: 0, answered: false };
}

function renderQuiz() {
  enter();
  if (!state.quiz.items.length) buildQuiz();
  const { items, index, score } = state.quiz;

  if (index >= items.length) {
    $("v").innerHTML = `
      <div class="box">${scoreBlock(score, items.length)}<br>
      <button class="pri" onclick="state.quiz.items=[];renderQuiz()">Ulangi</button></div>`;
    saveState();
    return;
  }

  const q = items[index];
  state.quiz.answered = false;
  $("v").innerHTML = `
    <div class="box">
      <div class="mu">Soal ${index + 1}/${items.length}</div>
      <div class="bar"><i style="width:${((index + 1) / items.length) * 100}%;--from:${(index / items.length) * 100}%"></i></div>
      <p style="font-size:18px">${q.question}</p>
      ${q.options.map((o, k) => `<button class="opt" style="--n:${k}" onclick="answerQuiz(${k})">${o}</button>`).join("")}
      <div id="ex"></div>
    </div>`;

  if (q.chosen !== undefined) showQuizFeedback();   // soal sudah dijawab sebelum refresh
  saveState();
}

function answerQuiz(k) {
  if (state.quiz.answered) return;
  const q = state.quiz.items[state.quiz.index];
  q.chosen = k;
  if (q.options[k] === q.answer) state.quiz.score++;
  showQuizFeedback();
  saveState();
}

function showQuizFeedback() {
  state.quiz.answered = true;
  const q = state.quiz.items[state.quiz.index];
  const k = q.chosen;
  const correct = q.options[k] === q.answer;

  document.querySelectorAll(".opt").forEach((btn, i) => {
    if (q.options[i] === q.answer) { btn.classList.add("ok"); btn.insertAdjacentHTML("beforeend", MARU); }
    else if (i === k) btn.classList.add("no");
  });

  $("ex").innerHTML = `
    <div class="ex"><b class="${correct ? "yes" : "nope"}">${correct ? "Benar." : "Kurang tepat."}</b> ${q.explanation}</div>
    <div class="row"><span></span>
      <button class="pri" onclick="state.quiz.index++;renderQuiz()">Lanjut</button>
    </div>`;
}

/* =========================================================
   8. GAME SUSUN KATA
   ========================================================= */
function newOrderQuestion() {
  enter();
  const pool = getSentences().filter(s => s.tokens.length >= 3);
  const sentence = pool[Math.floor(Math.random() * pool.length)];
  state.order = {
    sentence,
    picked: [],
    bank: shuffle(sentence.tokens.map((t, i) => ({ t, i }))),
  };
  renderOrderGame();
}

function renderOrderGame() {
  if (!state.order) return newOrderQuestion();
  const { sentence, picked, bank } = state.order;

  $("v").innerHTML = `
    <div class="box">
      <div class="mu">Susun kalimat berikut:</div>
      <p style="font-size:18px">"${sentence.meaning}"</p>
      <div class="ans">
        ${picked.map((x, n) => `<button class="chip" data-w="${x.i}" style="--i:${n}" onclick="removeWord(${x.i})">${x.t}</button>`).join("")}
      </div>
      <div>
        ${bank.filter(x => !picked.includes(x))
              .map(x => `<button class="chip" data-w="${x.i}" onclick="addWord(${x.i})">${x.t}</button>`).join("")}
      </div>
      <div id="res"></div>
      <div class="row">
        <button onclick="flipChips(() => { state.order.picked = []; })">Reset</button>
        <button onclick="checkOrder()">Cek jawaban</button>
        <button class="pri" onclick="newOrderQuestion()">Soal baru</button>
      </div>
    </div>`;
  saveState();
}

/* Jalankan perubahan lalu animasikan setiap kata dari posisi lama ke posisi barunya (teknik FLIP) */
function flipChips(change) {
  const before = new Map([...document.querySelectorAll("[data-w]")].map(el => [el.dataset.w, el.getBoundingClientRect()]));
  change();
  renderOrderGame();

  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches && document.documentElement.dataset.motion !== "full";
  if (calm) return;
  document.querySelectorAll("[data-w]").forEach(el => {
    const a = before.get(el.dataset.w);
    if (!a) return;
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    el.style.zIndex = 3;                                   // kata yang bergerak berada di atas kata lain
    el.animate(
      [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
      { duration: 320, easing: "cubic-bezier(.2,.8,.3,1)" }
    ).onfinish = () => { el.style.zIndex = ""; };
  });
}

function addWord(i) {
  flipChips(() => state.order.picked.push(state.order.bank.find(x => x.i === i)));
}

function removeWord(i) {
  flipChips(() => { state.order.picked = state.order.picked.filter(x => x.i !== i); });
}

function checkOrder() {
  const { sentence, picked } = state.order;
  const correct = picked.map(x => x.t).join(" ") === sentence.tokens.join(" ");
  $("res").innerHTML = `
    <div class="ex"><b class="${correct ? "yes" : "nope"}">${correct ? "Benar." : "Belum tepat."}</b> 
      Susunan benar: <b>${sentence.jp}</b> (${sentence.romaji})<br>
      <i>Bunpou:</i> ${sentence.chapter.grammar}</div>`;

  const ans = document.querySelector(".ans");
  if (ans) {
    ans.classList.remove("wave", "shake");
    void ans.offsetWidth;                       // mulai ulang animasi
    ans.classList.add(correct ? "wave" : "shake");
  }
}

/* =========================================================
   8c. HIRAGANA DAN KATAKANA
   Data ditulis sekali dalam hiragana; katakana dihitung dari kode huruf.
   "-" = kotak kosong.
   ========================================================= */
const KANA_GROUPS = [
  { name: "Huruf dasar", cols: 5, data:
    "あ=a,い=i,う=u,え=e,お=o,か=ka,き=ki,く=ku,け=ke,こ=ko,さ=sa,し=shi,す=su,せ=se,そ=so," +
    "た=ta,ち=chi,つ=tsu,て=te,と=to,な=na,に=ni,ぬ=nu,ね=ne,の=no,は=ha,ひ=hi,ふ=fu,へ=he,ほ=ho," +
    "ま=ma,み=mi,む=mu,め=me,も=mo,や=ya,-,ゆ=yu,-,よ=yo,ら=ra,り=ri,る=ru,れ=re,ろ=ro," +
    "わ=wa,-,-,-,を=wo,ん=n,-,-,-,-" },
  { name: "Dakuten dan handakuten", cols: 5, data:
    "が=ga,ぎ=gi,ぐ=gu,げ=ge,ご=go,ざ=za,じ=ji,ず=zu,ぜ=ze,ぞ=zo,だ=da,ぢ=ji,づ=zu,で=de,ど=do," +
    "ば=ba,び=bi,ぶ=bu,べ=be,ぼ=bo,ぱ=pa,ぴ=pi,ぷ=pu,ぺ=pe,ぽ=po" },
  { name: "Gabungan (youon)", cols: 3, data:
    "きゃ=kya,きゅ=kyu,きょ=kyo,しゃ=sha,しゅ=shu,しょ=sho,ちゃ=cha,ちゅ=chu,ちょ=cho," +
    "にゃ=nya,にゅ=nyu,にょ=nyo,ひゃ=hya,ひゅ=hyu,ひょ=hyo,みゃ=mya,みゅ=myu,みょ=myo," +
    "りゃ=rya,りゅ=ryu,りょ=ryo,ぎゃ=gya,ぎゅ=gyu,ぎょ=gyo,じゃ=ja,じゅ=ju,じょ=jo," +
    "びゃ=bya,びゅ=byu,びょ=byo,ぴゃ=pya,ぴゅ=pyu,ぴょ=pyo" },
];
KANA_GROUPS.forEach(g => { g.cells = g.data.split(",").map(x => (x === "-" ? null : x.split("="))); });

const toKatakana = s => [...s].map(c => String.fromCharCode(c.charCodeAt(0) + 0x60)).join("");
const kanaOf = (hira, script) => (script === "kata" ? toKatakana(hira) : hira);

function setKana(patch) {
  Object.assign(state.kana, patch);
  state.kana.fx = "script" in patch || patch.mode === "chart";   // animasi huruf muncul hanya saat tabel dibuka/diganti
  renderKana();
}

function renderKana() {
  if (state.kana.mode === "drill") renderKanaDrill();
  else renderKanaChart();
}

/* --- tabel huruf --- */
function renderKanaChart() {
  const k = state.kana;
  const groups = KANA_GROUPS.map(g => `
    <div class="kgroup">
      <h3>${g.name}</h3>
      <div class="kgrid ${k.hide ? "hide" : ""} ${k.fx ? "fx" : ""}" style="--cols:${g.cols}">
        ${g.cells.map((c, n) => c
          ? `<button class="kc" style="--n:${n}" onclick="this.classList.toggle('shown')"><b>${kanaOf(c[0], k.script)}</b><small>${c[1]}</small></button>`
          : `<span class="kc empty"></span>`).join("")}
      </div>
    </div>`).join("");

  $("v").innerHTML = `
    <div class="box">
      <div class="row" style="margin-top:0;justify-content:flex-start;flex-wrap:wrap">
        <button class="${k.script === "hira" ? "on" : ""}" onclick="setKana({script:'hira'})">Hiragana</button>
        <button class="${k.script === "kata" ? "on" : ""}" onclick="setKana({script:'kata'})">Katakana</button>
        <button class="${k.hide ? "on" : ""}" onclick="setKana({hide:!state.kana.hide})">Sembunyikan romaji</button>
      </div>
      <p class="mu">${k.hide ? "Ketuk sebuah huruf untuk melihat bacaannya." : "Sembunyikan romaji untuk menguji hafalanmu."}</p>
      ${groups}
      <div class="row"><span></span><button class="pri" onclick="startKanaDrill();renderKana()">Latihan membaca</button></div>
    </div>`;
  k.fx = false;
  saveState();
}

/* --- latihan membaca (15 soal, jenis soal bergantian) --- */
function startKanaDrill() {
  const k = state.kana, seen = new Set();
  /* ぢ dan づ dilewati karena bacaannya sama dengan じ dan ず */
  const pool = KANA_GROUPS.flatMap(g => g.cells.filter(Boolean)).filter(([, r]) => !seen.has(r) && seen.add(r));

  const items = shuffle(pool).slice(0, 15).map(([hira, romaji], n) => {
    const kana = kanaOf(hira, k.script);
    const wrong = shuffle(pool.filter(c => c[1] !== romaji)).slice(0, 3);
    const explanation = `${hira} (hiragana) dan ${toKatakana(hira)} (katakana) dibaca <b>${romaji}</b>.`;
    return n % 2
      ? { question: `Manakah huruf untuk bunyi "${romaji}"?`, answer: kana,
          options: shuffle([kana, ...wrong.map(c => kanaOf(c[0], k.script))]), explanation }
      : { question: `Bagaimana cara membaca 「${kana}」?`, answer: romaji,
          options: shuffle([romaji, ...wrong.map(c => c[1])]), explanation };
  });
  k.drill = { items, index: 0, score: 0, answered: false };
  k.mode = "drill";
}

function renderKanaDrill() {
  enter();
  const d = state.kana.drill;
  if (!d) return setKana({ mode: "chart" });

  if (d.index >= d.items.length) {
    $("v").innerHTML = `
      <div class="box">${scoreBlock(d.score, d.items.length)}
        <div class="row" style="justify-content:flex-start">
          <button class="pri" onclick="startKanaDrill();renderKana()">Ulangi</button>
          <button onclick="setKana({mode:'chart'})">Kembali ke tabel</button>
        </div></div>`;
    saveState();
    return;
  }

  const q = d.items[d.index];
  d.answered = false;
  $("v").innerHTML = `
    <div class="box">
      <div class="mu">Soal ${d.index + 1}/${d.items.length}</div>
      <div class="bar"><i style="width:${((d.index + 1) / d.items.length) * 100}%;--from:${(d.index / d.items.length) * 100}%"></i></div>
      <p style="font-size:18px">${q.question}</p>
      ${q.options.map((o, k) => `<button class="opt" style="--n:${k}" onclick="answerKana(${k})">${o}</button>`).join("")}
      <div id="ex"></div>
      <div class="row"><button onclick="setKana({mode:'chart'})">Kembali ke tabel</button><span></span></div>
    </div>`;

  if (q.chosen !== undefined) showKanaFeedback();
  saveState();
}

function answerKana(k) {
  const d = state.kana.drill;
  if (d.answered) return;
  const q = d.items[d.index];
  q.chosen = k;
  if (q.options[k] === q.answer) d.score++;
  showKanaFeedback();
  saveState();
}

function showKanaFeedback() {
  const d = state.kana.drill;
  d.answered = true;
  const q = d.items[d.index], k = q.chosen;
  const correct = q.options[k] === q.answer;

  document.querySelectorAll(".opt").forEach((btn, i) => {
    if (q.options[i] === q.answer) { btn.classList.add("ok"); btn.insertAdjacentHTML("beforeend", MARU); }
    else if (i === k) btn.classList.add("no");
  });
  $("ex").innerHTML = `
    <div class="ex"><b class="${correct ? "yes" : "nope"}">${correct ? "Benar." : "Kurang tepat."}</b> ${q.explanation}</div>
    <div class="row"><span></span>
      <button class="pri" onclick="state.kana.drill.index++;renderKanaDrill()">Lanjut</button>
    </div>`;
}
